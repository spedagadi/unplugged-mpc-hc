<svg width="240" height="200" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="unplugged logo mark">
  <!--
    unplugged — logo mark
    Concept: the signal cable is a tone-mapping roll-off curve; it terminates in a
    plug pulled free of its socket. The gap + spark is the "unplugged" moment.
    Palette: EVA orange #E8551F, bright spark #FF7A3D.
  -->
  <defs>
    <linearGradient id="cableGrad" x1="30" y1="170" x2="152" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8551F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8551F" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- tone-map roll-off curve = the cable -->
  <path d="M 30 170 C 78 170 100 150 116 114 C 128 88 138 72 152 66"
        fill="none" stroke="url(#cableGrad)" stroke-width="9"
        stroke-linecap="round"/>

  <!-- socket (pulled away, dimmer) -->
  <g stroke="#E8551F" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="208" y="49" width="24" height="34" rx="7"/>
    <line x1="210" y1="61" x2="217" y2="61"/>
    <line x1="210" y1="71" x2="217" y2="71"/>
  </g>

  <!-- plug head at the end of the cable -->
  <g stroke="#E8551F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="150" y="52" width="32" height="28" rx="8"/>
    <line x1="182" y1="61" x2="194" y2="61"/>
    <line x1="182" y1="71" x2="194" y2="71"/>
  </g>

  <!-- spark at the disconnect: the freed signal -->
  <g stroke="#FF7A3D" stroke-width="4" stroke-linecap="round">
    <circle cx="201" cy="66" r="2.5" fill="#FF7A3D" stroke="none"/>
    <line x1="201" y1="56" x2="201" y2="60"/>
    <line x1="201" y1="72" x2="201" y2="76"/>
    <line x1="193" y1="66" x2="197" y2="66"/>
    <line x1="205" y1="66" x2="209" y2="66" stroke-opacity="0.6"/>
  </g>
</svg>
